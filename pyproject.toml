[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ntu-room-checker"
version = "0.1.0"
description = "Reusable scraper for NTU public class schedules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ntu-room-checker = "ntu_room_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
